spring:
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/pautas}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
    flyway:
        # Bancos criados antes das migrations já têm as tabelas: a V1 usa "if not exists"
        baseline-on-migrate: true
        baseline-version: 0
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
