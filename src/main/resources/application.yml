spring:
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://localhost:5432/pautas?useTimezone=true&serverTimezone=UTC
        username: postgres
        password: postgres
    flyway:
        # Bancos criados antes das migrations já têm as tabelas: a V1 usa "if not exists"
        baseline-on-migrate: true
        baseline-version: 0
    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                show_sql: false
        open-in-view: false
