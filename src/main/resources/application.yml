spring:
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://localhost:5432/pautas?useTimezone=true&serverTimezone=UTC
        username: postgres
        password: postgres
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                show_sql: false
                hbm2ddl:
                    auto: create-drop
        generate-ddl: true
        open-in-view: false
